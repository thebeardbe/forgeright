# forgeright, ready to look at.
#
#   cp .env.example .env      # then set SESSION_SECRET
#   docker compose up
#
# Then open https://localhost:8443/admin and sign in as demo@example.test, or follow the
# read-only demo link (see THE DEMO LINK below).
#
# WHAT THIS GIVES YOU: the console, the committed demo organisation, and the read-only
# demo link, over TLS. No provider key is needed, because the demo's processes are already
# grouped and scored - the database is committed for exactly that reason. A provider is
# only needed to run a live interview or reweigh something.
#
# WHY TWO SERVICES. The app refuses plain HTTP by design: the admin cookie and the
# participant link are bearer credentials and the request bodies describe how a business
# runs. Rather than weaken that rule for a local container, Caddy terminates TLS in front,
# which is what the real deployment does behind its proxy. See Caddyfile.
#
# ===========================================================================
# TWO SHAPES: PICK THE ONE THAT MATCHES WHERE THE TLS IS TERMINATED
# ===========================================================================
#
# `docker compose up` publishes Caddy on 8443 and gives you a self-signed HTTPS console at
# https://localhost:8443. THAT IS THE LOCAL CONSOLE, for looking at the product on the
# machine it runs on. Nothing else needs to exist first.
#
# `docker compose --profile proxy up` publishes THE APPLICATION ITSELF on host port 3000,
# with no Caddy, for the case where something ELSE has already terminated TLS. That is the
# shape for a VPS behind nginx, and for this machine's live instance, where the terminator
# is `tailscale serve`.
#
# THE PROFILE IS NAMED FOR WHAT IT IS, NOT FOR WHAT THIS MACHINE USES. It means "there is
# already a TLS terminator in front of the container"; whether that is nginx, Caddy on the
# host, Tailscale or something else makes no difference to this file.
#
# `tailscale` STILL WORKS AS AN ALIAS, because this file used to use that name. See the
# note on the service below.
#
# THE TWO ARE MUTUALLY EXCLUSIVE, AND THAT NEEDS ONE LINE IN .env. Compose profiles are
# ADDITIVE: `--profile proxy` alone would start the app ON TOP of the unprofiled local
# console, giving two applications over one store and two things answering on different
# ports. So BOTH shapes are behind a profile, and one is chosen by default:
#
#   COMPOSE_PROFILES=local     # in .env, so a bare `docker compose up` is the local console
#
# With that line, `docker compose up` is the local shape and
# `docker compose --profile proxy up` is the behind-a-terminator shape, and neither drags
# the other along. WITHOUT IT, a bare `docker compose up` starts NOTHING, because every
# service would be behind a profile - which is why .env.example sets it and the README
# repeats it.
#
# TO SWITCH SHAPES: `docker compose --profile local down` then bring up the other.
#
# WHY THE SECOND SHAPE EXISTS AT ALL. Caddy in the first shape terminates TLS itself and is
# named `localhost` with its own internal CA. Behind an EXISTING terminator that is wrong
# twice over: the TLS is ALREADY terminated out there, so Caddy would be a second TLS session
# inside the first (and its self-signed certificate would fail validation, having been issued
# for a name no client believes), and Caddy's site is named `localhost`, so it cannot answer
# for a public hostname at all. Putting Caddy in front of an existing TLS terminator is not a
# configuration to get right; it is the wrong component.
#
# SO THE APPLICATION IS PUBLISHED DIRECTLY, AND THE TLS IS NOT OUR PROBLEM: the hop in front
# terminates it, sets X-Forwarded-Proto: https, and the app believes that header because the
# hop is named in TRUST_PROXY. The app still refuses plain HTTP from anywhere else.
#
# WHY BOTH SHAPES ARE IN ONE FILE. They share the build, the image, the store volume, the
# demo mount and the environment. Two files would be two places for the store path and the
# demo settings to drift apart, and the drift would be silent.
#
# WHICH SHAPE IS RUNNING IS VISIBLE IN `docker compose ps`: the behind-a-terminator shape
# has a `forgeright-app` service with a published port.
#
# ===========================================================================
# RUNNING A SECOND COPY, OR ANY COPY BESIDE ANOTHER
# ===========================================================================
#
# THIS FILE RESERVES A FIXED IP RANGE, and Docker refuses two networks with the same pool.
# A second checkout on the same machine therefore fails with
#
#   Network <name>_default Error: invalid pool request: Pool overlaps with other one
#   on this address space
#
# which is about IP pools and says nothing about a second checkout, so the cause is hard to
# guess from the message. THE RANGE IS FIXED BECAUSE THE TRUST BOUNDARY NEEDS A KNOWN
# ADDRESS: the app honours `X-Forwarded-Proto` only from the proxy's address, and that
# address has to be knowable before the container starts.
#
# TO RUN A SECOND COPY, set all three values in a file beside the compose file, or in the
# shell, choosing a range nothing else uses:
#
#   FORGERIGHT_SUBNET=172.31.0.0/24
#   FORGERIGHT_APP_IP=172.31.0.2
#   FORGERIGHT_PROXY_IP=172.31.0.3
#
# ALL THREE, NOT JUST THE SUBNET. Changing the subnet alone fails loudly - Docker reports
# "no configured subnet contains IP address 172.30.0.2" - because the addresses do not
# follow the range by themselves. That failure is preferable to the silent alternative,
# which would be an app trusting an address outside its own network and redirecting every
# request to itself.
#
# A THIRD CONTAINER PORT WOULD ALSO COLLIDE, so a second copy needs its own published port
# too: see the `ports` entry on the proxy below.
#
# ===========================================================================
# THE ENVIRONMENT: WHAT COMES FROM .env AND WHAT THIS FILE FORCES
# ===========================================================================
#
# `env_file` LOADS THE REPO'S `.env` AT RUNTIME, so the image carries no credentials. It is
# also why the image is safe to publish: a secret is in a file on the host that compose
# reads, not in a layer anybody can pull.
#
# `environment` OVERRIDES `env_file` for the same key. That matters here: the repo's `.env`
# points PUBLIC_BASE_URL at the Tailscale hostname and TRUST_PROXY at that proxy, which are
# correct for the deployed instance and WRONG for a local container. Without these overrides
# the browser would be sent to a hostname it cannot reach and every asset URL would carry a
# prefix this container does not serve.

services:
  forgeright:
    # `local` ONLY, never both. This service exists to be proxied by the Caddy in this same
    # file; the behind-a-terminator shape serves the application with `forgeright-app`
    # instead, and starting this one too would put two applications over one store volume.
    # See the TWO SHAPES block.
    profiles: ["local"]
    # A PINNED ADDRESS TOO, so the two services cannot swap and leave TRUST_PROXY naming the
    # application itself - which would let the app trust its own forwarded headers.
    networks:
      default:
        ipv4_address: ${FORGERIGHT_APP_IP:-172.30.0.2}
    build:
      context: .
      dockerfile: Dockerfile
    image: forgeright:local
    # `unless-stopped` rather than `always`: a deliberate `docker compose stop` should stay
    # stopped. `unless-stopped` restarts after a crash or a host reboot and not after a
    # person said stop, which is the behaviour someone running this locally expects.
    restart: unless-stopped
    # THE APP IS NOT PUBLISHED TO THE HOST. The only way in is through the proxy below,
    # which is what makes the proxy's forwarded headers worth trusting: a client that could
    # reach this port directly could claim X-Forwarded-Proto itself.
    expose:
      - "3000"
    env_file:
      # The repo's own file, read at run time. NOT copied into the image: see .dockerignore.
      # Compose fails with a clear message if it is absent.
      - .env
    environment:
      # --- forced for a local container, overriding .env ---
      HOST: 0.0.0.0                      # otherwise the published port reaches nothing
      PORT: "3000"
      # OUTSIDE /app, AND THAT IS NOT ARBITRARY. The app reads its SQL schema from
      # `PROJECT_ROOT/data/store/schema.sql`, where PROJECT_ROOT is the application
      # directory rather than STORE_DIR. A volume mounted over /app/data/store therefore
      # hides the schema and every connection fails with ENOENT - measured, that is exactly
      # what the first working build did. Keeping the store under /data means the volume
      # covers only data and the schema stays in the image where it belongs.
      STORE_DIR: /data/store
      # The app refuses a Host it does not know. These are the names a browser uses to
      # reach the published port on this machine.
      ALLOWED_HOST: "localhost,127.0.0.1"
      # https, because the app refuses plain HTTP and redirects to this value. It is what
      # sign-in links are built from, so it must be the URL the BROWSER uses.
      PUBLIC_BASE_URL: "https://localhost:${FORGERIGHT_PORT:-8443}"
      # THE PROXY'S ADDRESS, AND ONLY THE PROXY CAN CLAIM TO BE SECURE. The app resolves
      # `req.secure` from the connection and honours X-Forwarded-Proto only from a peer
      # named here, so a client that reached this port could not forge it.
      #
      # THE ADDRESS IS PINNED IN THE NETWORK BLOCK, NOT OBSERVED. Docker allocates
      # addresses in the order containers start, and the first attempt assumed the proxy
      # would be `.2` - it was `.3`, because the app started first and took `.2`. The app
      # then trusted nobody and redirected every request to its own PUBLIC_BASE_URL in a
      # 308 loop. `ipv4_address` on the proxy service is what makes this line true rather
      # than lucky.
      TRUST_PROXY: "${FORGERIGHT_PROXY_IP:-172.30.0.3}"
      # Served at the origin root. A prefix needs a proxy that strips or passes it, and
      # this one does neither.
      BASE_PATH: ""
      # No provider call is made to serve the demo, so the provider is left alone. A
      # provider and a key are only needed for a live interview or a reweigh.

      # --- the read-only demo link ---
      # FOUR VARIABLES, and all four are needed. The route is NOT REGISTERED without
      # DEMO_LOGIN=1, so an unconfigured instance answers /admin/demo as any unknown path.
      # DEMO_LOGIN_ORG is the pinned id the seed writes, and DEMO_LOGIN_TOKEN must be at
      # least 24 characters. See .env.example for the full description of each.
      #
      # SET HERE RATHER THAN IN .env SO THE DEMO WORKS OUT OF THE BOX, which is what "check
      # out the repo and run compose up" has to mean. The token below is a PLACEHOLDER for
      # a local demo: it is in the repository, so anyone reading it can open the link.
      # Acceptable on your own machine, NOT for anything reachable from the internet.
      # Override it in .env to change it.
      DEMO_LOGIN: "1"
      DEMO_LOGIN_ORG: "example-ltd-demo"
      DEMO_LOGIN_TOKEN: "${DEMO_LOGIN_TOKEN:-local-demo-read-only-token-change-me}"
      DEMO_LOGIN_DAYS: "60"
    volumes:
      # --- the store: PERSISTENT, and outside the image ---
      #
      # A NAMED VOLUME, so `docker compose down` and `up` keeps the organisations. Without
      # it every restart would present an empty console, because a container writes to its
      # own layer and a new container starts from the image again.
      - forgeright-store:/data/store

      # --- the committed demo: READ-ONLY, and deliberately not the store ---
      #
      # `:ro` IS THE ARTEFACT-INTEGRITY REQUIREMENT. `data/demo` is a committed file with a
      # pinned organisation id; a container writing to it would dirty the working tree, and
      # this artefact has already been lost once.
      #
      # IT IS THE SOURCE, NOT THE STORE. The app cannot open a read-only database - every
      # connection applies the schema, which is a write - so the entrypoint copies this into
      # the writable volume on first start and the app opens the copy. See
      # docker-entrypoint.sh.
      - ./data/demo:/app/data/demo:ro
    healthcheck:
      # THE PATTERN IS TAKEN FROM WHAT THE APP ALREADY PRINTS, not a signal invented here. A
      # working startup logs `[server] listening on http://0.0.0.0:3000` followed by the
      # provider, the mount point, the trust-proxy setting and the accepted hosts. A failure
      # - a missing SESSION_SECRET, a bad PUBLIC_BASE_URL - throws BEFORE serving, so the
      # process exits and this reports unhealthy rather than looking up while nothing listens.
      #
      # `/healthz` rather than `/`: the root serves the landing page and would keep answering
      # 200 for a page whose assets are all 404. It is also the app's one path exempt from
      # the HTTPS rule, which is what lets the check run over plain HTTP inside the network.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # The TLS terminator. See Caddyfile for why this exists rather than plain HTTP:
  # the app refuses insecure connections by design, and that rule is load-bearing.
  # ---------------------------------------------------------------------------
  proxy:
    # NOT STARTED IN THE BEHIND-A-TERMINATOR SHAPE, which is the whole point of that shape:
    # Caddy cannot sit behind a terminator that already terminated. A `profiles` entry does
    # not achieve that on its own, because a service with NO profile is always started; the
    # two shapes are separated by this service being in `local` and the other being in
    # `proxy`. See the TWO SHAPES block at the top for which command to run.
    profiles: ["local"]
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports:
      # 8443 RATHER THAN 443, so the container needs no privileged port and the URL says
      # what it is: https://localhost:8443.
      #
      # A SECOND COPY NEEDS A DIFFERENT HOST PORT, for the same reason as the subnet above.
      # Override it with FORGERIGHT_PORT and the container's own PUBLIC_BASE_URL follows.
      - "${FORGERIGHT_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's internal CA and its certificates. A named volume so the CA survives a
      # restart, which means a browser warning is accepted once rather than every time.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      forgeright:
        # Waiting for healthy means the first request does not race the app's startup and
        # get a 502, which reads as a broken proxy rather than a starting application.
        condition: service_healthy
    networks:
      default:
        # A PINNED ADDRESS, so the app's TRUST_PROXY above names something guaranteed
        # rather than whatever Docker happened to allocate.
        ipv4_address: ${FORGERIGHT_PROXY_IP:-172.30.0.3}

  # ---------------------------------------------------------------------------
  # THE OTHER SHAPE: the application itself, published on host port 3000, with the
  # TLS terminated by something in front of it. See the TWO SHAPES block at the top.
  #
  # IT IS BEHIND A PROFILE, so `docker compose up` does not start it and the default
  # local console is unchanged. A profile rather than a second file because everything
  # except the published port and the trust setting is identical, and two files would
  # drift.
  # ---------------------------------------------------------------------------
  forgeright-app:
    # TWO NAMES, ONE PROFILE. `proxy` is the name that means what this shape is: the app
    # runs behind a TLS terminator that is NOT in this file. `tailscale` is kept as an
    # ALIAS because this file used to carry that name, and a script that still says
    # `--profile tailscale` would otherwise start NOTHING - compose accepts an unknown
    # profile silently and exits 0, so the failure would look like success.
    #
    # DO NOT TREAT THEM AS DIFFERENT SHAPES: they select this one service. `proxy` is the
    # documented name; the alias is compatibility and can be removed once nothing calls it.
    profiles: ["proxy", "tailscale"]
    build:
      context: .
      dockerfile: Dockerfile
    image: forgeright:local
    restart: unless-stopped
    # BOUND TO THE HOST LOOPBACK ONLY, AND THAT IS THE SECURITY PROPERTY OF THIS SHAPE.
    #
    # `127.0.0.1:3000:3000` rather than `3000:3000`. Publishing on 0.0.0.0 would offer
    # PLAIN HTTP - the app's refusal to serve one is deliberate, see lib/auth/require-secure.js -
    # to anything that can reach this host, including the LAN and, on this machine, the
    # tailnet itself at 100.70.135.127. Bound to loopback, the listener is on 127.0.0.1
    # and no other interface: MEASURED, and the measurements are worth recording because
    # the obvious assumption is wrong twice over.
    #
    # A TERMINATOR ON THE HOST REACHES A LOOPBACK LISTENER, BECAUSE IT DIALS IT FROM THE
    # HOST ITSELF. That is true of `tailscale serve` on this machine - which proxies to
    # http://127.0.0.1:3000 - and equally true of nginx, or Caddy, or anything else running
    # on the host. A terminator in ANOTHER CONTAINER is the case to think about: it cannot
    # reach 127.0.0.1 of the host, so it needs the two containers on a shared network,
    # which is the reader's setup rather than this file's.
    #
    # MEASURED on this machine, with `tailscale serve` as the terminator:
    #   - loopback answers (200), and the tailnet address 100.70.135.127 refuses (000)
    #   - from another network namespace - a neighbouring container, the LAN address, the
    #     tailnet address - the listener is unreachable (000 for all three)
    #
    # So a loopback publish is the narrowest form that still serves a host-resident
    # terminator.
    ports:
      # LOOPBACK ONLY, because the app must not be offering plain HTTP on an interface
      # anything else can reach. See the comment block above.
      #
      # CHANGE THIS TO "3000:3000" ONLY IF YOUR TERMINATOR IS IN ANOTHER CONTAINER, and
      # read DEPLOY.md first: that publishes plain HTTP on every interface of this host.
      #
      # `FORGERIGHT_PROXY_PORT` is the variable; `FORGERIGHT_TAILSCALE_PORT` is still read
      # as a fallback so an existing .env keeps working. Both are in the same expression,
      # so setting the new one wins.
      - "127.0.0.1:${FORGERIGHT_PROXY_PORT:-${FORGERIGHT_TAILSCALE_PORT:-3000}}:3000"
    env_file:
      - .env
    environment:
      # --- forced, and these differ from the proxy shape ---
      HOST: 0.0.0.0
      PORT: "3000"
      STORE_DIR: /data/store
      # THE PUBLIC HOSTNAME, because that is the name the BROWSER uses. The app refuses
      # a Host it was not told about, so leaving this as "localhost" would 421 every request
      # arriving through the terminator. Overridable for a different hostname.
      #
      # 127.0.0.1 IS LISTED TOO, so a direct curl on the host - the fastest way to tell an
      # app problem from a terminator problem - is not refused.
      ALLOWED_HOST: "${FORGERIGHT_ALLOWED_HOST:-pi-agents.tail399956.ts.net,127.0.0.1,localhost}"
      # THE REAL PUBLIC URL, INCLUDING THE PATH THE TUNNEL MOUNTS UNDER. This is the URL
      # the browser uses and what sign-in links are built from. It is https even though
      # THIS container speaks http, because the scheme the browser sees is decided by the
      # terminator in front.
      PUBLIC_BASE_URL: "${FORGERIGHT_PUBLIC_BASE_URL:-https://pi-agents.tail399956.ts.net/forgeright}"
      # THE BRIDGE GATEWAY, NOT 127.0.0.1. This is the measurement that matters most in
      # this shape, and the intuitive value is wrong:
      #
      #   [auth] refusing an insecure request to GET /admin (host 127.0.0.1:3999, peer 172.17.0.1)
      #
      # A request published to the host arrives from the DOCKER GATEWAY, because
      # docker-proxy forwards it - so `TRUST_PROXY=127.0.0.1` (the value in the repo's
      # .env, which is correct for the host-run deployment) names nothing this container
      # will ever see. With it, every request through the terminator is refused with a 308
      # redirect loop and the console never loads.
      #
      # The gateway is the FIRST address of the network's subnet, so it follows
      # FORGERIGHT_SUBNET rather than being a second thing to keep in step.
      TRUST_PROXY: "${FORGERIGHT_GATEWAY_IP:-172.30.0.1}"
      BASE_PATH: ""
      # EMPTY WHEN THE TERMINATOR STRIPS ITS PREFIX BEFORE FORWARDING, which is what
      # `tailscale serve --set-path /forgeright` does on this machine, so the app is mounted
      # at the root and PUBLIC_BASE_URL carries the prefix the browser sees. Set BASE_PATH
      # only if the terminator forwards the prefix through and the app must strip it itself.
      # See lib/base-path.js. A path in the wrong place here doubles the prefix.
      #
      # THE DEMO TOKEN COMES FROM .env, AND THE PLACEHOLDER IS REFUSED IN THIS SHAPE BY
      # THE APPLICATION, not by a requirement in this file. Set DEMO_LOGIN_TOKEN in .env.
      #
      # NOT `${DEMO_LOGIN_TOKEN:?}` HERE, which is the obvious way and is wrong: Compose
      # interpolates the WHOLE file before it applies a profile, so a missing value stops
      # `docker compose up` too - breaking the local console for exactly the fresh clone
      # this file has to keep working. Measured, that is what the first attempt did.
      #
      # The app is also the better layer for the rule. It knows the difference between
      # "unset" (falls through to the placeholder) and "set to the placeholder", and it
      # refuses with a message naming the value, the rule and the fix - while a Compose
      # interpolation error would say only that a variable is missing. See
      # lib/auth/demo-token-policy.js.
      DEMO_LOGIN: "1"
      DEMO_LOGIN_ORG: "example-ltd-demo"
      DEMO_LOGIN_TOKEN: "${DEMO_LOGIN_TOKEN:-local-demo-read-only-token-change-me}"
      DEMO_LOGIN_DAYS: "60"
      # WHICH PROTON PROFILE TO SEND FROM. Left unset so the app's own default applies,
      # and that default is named for a signed-in JOBSEARCH account on the machine this
      # was built on - which is the wrong answer for a deployment. Set
      # MAIL_PROTON_PROFILE in .env to the profile you actually signed in as.
      #
      # The startup check reports when proton-cli has NO session at all. It cannot know
      # which profile you intended, so a profile name that does not exist is found at
      # the first send rather than at boot. See lib/mail/proton.js.
    volumes:
      # THE SAME STORE VOLUME AS THE PROXY SHAPE, deliberately: running the other shape
      # afterwards shows the same organisations rather than an empty console.
      - forgeright-store:/data/store
      - ./data/demo:/app/data/demo:ro

      # --- the Proton session: a VOLUME, never the image and never the host ---
      #
      # THIS IS WHERE THE MAIL CREDENTIAL LIVES, and it is the point of the arrangement.
      # The proton-cli BINARY is in the image; the SESSION that lets it send is here, in
      # a named volume, so it is not in the image (which can be pushed to a registry) and
      # not in the repository (which is public). Getting a copy requires access to this
      # docker host.
      #
      # XDG_CONFIG_HOME IS SET IN THE IMAGE, pointing at /home/node/.config, so the binary
      # keeps its sessions in THIS volume and nowhere else. The alternative, PROTON_CONFIG,
      # names the settings FILE only: sessions would stay beside HOME and the credential
      # would land outside the volume. Measured, not inferred; see the Dockerfile.
      #
      # SIGN IN ONCE, INSIDE THE CONTAINER, AND IT PERSISTS HERE:
      #
      #   docker compose --profile proxy exec -it forgeright-app \
      #     proton-cli account login --profile forgeright
      #
      # A named volume rather than a bind mount on purpose: a bind mount would place the
      # credential in a directory on the host, which is the thing being avoided.
      - proton-session:/home/node/.config
    healthcheck:
      # THE SAME CHECK AS THE PROXY SHAPE, and it works unmodified: /healthz is the one
      # path exempt from the HTTPS rule, and the check comes from inside the container
      # where the peer is loopback.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

networks:
  default:
    # A FIXED SUBNET, so TRUST_PROXY can name the proxy's address. Without it Docker picks
    # an arbitrary one and the app would trust nobody - or, worse, trust an address that
    # something else later occupies.
    ipam:
      config:
        - subnet: ${FORGERIGHT_SUBNET:-172.30.0.0/24}

volumes:
  # Named, so it survives `down` and is only removed by `down -v`, which is the explicit way
  # to say "destroy the data".
  forgeright-store:
  caddy-data:
  caddy-config:
  # The Proton session. Named, so `docker compose down` keeps it and only `down -v`
  # removes it - signing in again is manual, and losing it to a routine restart would be
  # a nasty surprise.
  proton-session:
