# forgeright, ready to look at.
#
#   cp .env.example .env      # then set SESSION_SECRET
#   docker compose up
#
# Then open https://localhost:8443/admin and sign in as demo@example.test, or follow the
# read-only demo link (see THE DEMO LINK below).
#
# WHAT THIS GIVES YOU: the console, the committed demo organisation, and the read-only
# demo link, over TLS. No provider key is needed, because the demo's processes are already
# grouped and scored - the database is committed for exactly that reason. A provider is
# only needed to run a live interview or reweigh something.
#
# WHY TWO SERVICES. The app refuses plain HTTP by design: the admin cookie and the
# participant link are bearer credentials and the request bodies describe how a business
# runs. Rather than weaken that rule for a local container, Caddy terminates TLS in front,
# which is what the real deployment does behind its proxy. See Caddyfile.
#
# ===========================================================================
# ===========================================================================
# ONE SHAPE: A SELF-CONTAINED LOCAL CONSOLE
# ===========================================================================
#
# `docker compose up` publishes Caddy on 8443 and gives you a self-signed HTTPS console at
# https://localhost:8443. Nothing else needs to exist first: no external network, no
# certificate, no proxy. THAT IS THE WHOLE POINT OF THIS FILE, and it is why Caddy is here
# rather than being left to your own terminator - a fresh clone can look at the product
# without setting anything up.
#
# FOR A SERVER, USE `docker-compose.deploy.yml` INSTEAD. That is the owner's own pattern:
# one service on an external `proxy-network`, no published ports, no TLS handled here, with
# nginx in front. It is deliberately a separate file rather than a second service in this
# one, because a server does not want a second terminator to keep working - and because two
# shapes in one file is how this file grew a reserved IP subnet, pinned addresses and a
# page of instructions about choosing a free range for a second checkout. All of that is
# gone.
#
# WHY CADDY EARNS ITS PLACE HERE, and only here: the app refuses plain HTTP by design (the
# admin cookie and the participant link are bearer credentials), so a local console needs
# SOMETHING to terminate TLS. Doing it in this file is what makes `docker compose up`
# sufficient on its own. On a server that job belongs to nginx.
#
# ===========================================================================
# THE ENVIRONMENT: WHAT COMES FROM .env AND WHAT THIS FILE FORCES
# ===========================================================================
#
# `env_file` loads the repo's `.env` at run time, so the image carries no credentials. It
# is also why the image is safe to publish: a secret is in a file on the host that compose
# reads, not in a layer anybody can pull.
#
# `environment` OVERRIDES `env_file` for the same key, and `.env` is written for the app
# running DIRECTLY ON THE HOST - so several of its values are wrong in a container and are
# forced below. Two matter:
#
#   HOST             `.env` says 127.0.0.1, which inside a container is the CONTAINER's
#                    loopback; a published port would reach nothing.
#   TRUST_PROXY      `.env` names the host's terminator address, which this container never
#                    sees. See the note on the value below.
#
# See DEPLOY.md for the server, README for the console, and .env.example for every variable.

services:
  forgeright:
    # A FIXED NAME, SO THE CONTAINER IS CALLED `forgeright` AND NOT
    # `forgeright-forgeright-1`. Compose's generated name is the PROJECT plus the SERVICE,
    # and both are called "forgeright" in this directory, so the default doubled the word.
    # That read as two containers where there is one, and it was reported as a bug twice.
    container_name: forgeright-local
    build:
      context: .
      dockerfile: Dockerfile
    image: forgeright:local
    # `unless-stopped` rather than `always`: a deliberate `docker compose stop` should stay
    # stopped. `unless-stopped` restarts after a crash or a host reboot and not after a
    # person said stop, which is the behaviour someone running this locally expects.
    restart: unless-stopped
    # THE APP IS NOT PUBLISHED TO THE HOST. The only way in is through the proxy below,
    # which is what makes the proxy's forwarded headers worth trusting: a client that could
    # reach this port directly could claim X-Forwarded-Proto itself.
    expose:
      - "3000"
    env_file:
      # The repo's own file, read at run time. NOT copied into the image: see .dockerignore.
      # Compose fails with a clear message if it is absent.
      - .env
    environment:
      # --- forced for a local container, overriding .env ---
      HOST: 0.0.0.0                      # otherwise the published port reaches nothing
      PORT: "3000"
      # OUTSIDE /app, AND THAT IS NOT ARBITRARY. The app reads its SQL schema from
      # `PROJECT_ROOT/data/store/schema.sql`, where PROJECT_ROOT is the application
      # directory rather than STORE_DIR. A volume mounted over /app/data/store therefore
      # hides the schema and every connection fails with ENOENT - measured, that is exactly
      # what the first working build did. Keeping the store under /data means the volume
      # covers only data and the schema stays in the image where it belongs.
      STORE_DIR: /data/store
      # The app refuses a Host it does not know. These are the names a browser uses to
      # reach the published port on this machine.
      ALLOWED_HOST: "localhost,127.0.0.1"
      # https, because the app refuses plain HTTP and redirects to this value. It is what
      # sign-in links are built from, so it must be the URL the BROWSER uses.
      PUBLIC_BASE_URL: "https://localhost:${FORGERIGHT_PORT:-8443}"
      # ONLY THE PROXY CAN CLAIM TO BE SECURE. The app resolves `req.secure` from the
      # connection and honours X-Forwarded-Proto only from a peer named here, so a client
      # that reached this port could not forge it.
      #
      # `uniquelocal` TRUSTS ANY PRIVATE-RANGE PEER. This file used to pin the proxy's exact
      # address in a fixed subnet, which worked but brought machinery with it: a reserved
      # IP range, `ipv4_address` on two services, and a page of instructions about choosing
      # a free range for a second checkout. All of it existed so this one line could name a
      # guaranteed address. A private-range peer is what the deploy shape uses too, it
      # survives an address changing, and it removes the range collision entirely.
      #
      # WHAT IT IS NOT: a boolean. `TRUST_PROXY=true` trusts EVERY client, so any request
      # could claim to be secure, and `lib/trust-proxy.js` refuses it at startup rather than
      # accepting something unsafe.
      TRUST_PROXY: "${FORGERIGHT_TRUST_PROXY:-uniquelocal}"
      # Served at the origin root. A prefix needs a proxy that strips or passes it, and
      # this one does neither.
      BASE_PATH: ""
      # No provider call is made to serve the demo, so the provider is left alone. A
      # provider and a key are only needed for a live interview or a reweigh.

      # --- the read-only demo link ---
      # FOUR VARIABLES, and all four are needed. The route is NOT REGISTERED without
      # DEMO_LOGIN=1, so an unconfigured instance answers /admin/demo as any unknown path.
      # DEMO_LOGIN_ORG is the pinned id the seed writes, and DEMO_LOGIN_TOKEN must be at
      # least 24 characters. See .env.example for the full description of each.
      #
      # SET HERE RATHER THAN IN .env SO THE DEMO WORKS OUT OF THE BOX, which is what "check
      # out the repo and run compose up" has to mean. The token below is a PLACEHOLDER for
      # a local demo: it is in the repository, so anyone reading it can open the link.
      # Acceptable on your own machine, NOT for anything reachable from the internet.
      # Override it in .env to change it.
      # --- WHICH PROVIDER AND WHICH MAIL TRANSPORT: PASSED EXPLICITLY ---
      #
      # AI_PROVIDER IS THE ONE THAT MATTERS, and this is the deployment the owner was
      # testing when he found the gap. The app's own default is `mock` (see
      # config/ai-config.json's defaultProvider), which answers every turn with a scripted
      # interview question and NEVER completes: a deployment left on it cannot run an
      # interview, and nothing about that is visible from outside the container.
      #
      # IT IS NOT AN ERROR, and must not become one: local development legitimately uses
      # mock, and the test suite depends on it. What was wrong was the SILENCE, so the
      # server now warns when it looks like a deployment and the provider is still mock.
      # See the note on that warning in DEPLOY.md.
      #
      # A REAL KEY WITHOUT AI_PROVIDER IS IGNORED, silently, because the mock branch skips
      # the key check - so `DEEPSEEK_API_KEY` being set proves nothing about which provider
      # is in use. Set AI_PROVIDER as well.
      AI_PROVIDER: "${AI_PROVIDER:-mock}"
      # `console` prints the message to stdout and sends NOTHING. Correct for development;
      # wrong for anyone expecting a participant to receive a link.
      MAIL_SENDER: "${MAIL_SENDER:-console}"
      # Which Proton profile to send from, when MAIL_SENDER=proton. The app's own default
      # is a jobsearch account on the machine this was built on, which is wrong for every
      # deployment.
      MAIL_PROTON_PROFILE: "${MAIL_PROTON_PROFILE:-}"
      # The provider keys, so they are visible on the settings surface rather than only in
      # `.env`. Empty is correct for mock; an empty key with a real provider is a startup
      # warning from ai/config.js.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # --- HOW LONG THINGS LAST, when an operator wants to change them ---
      # A sign-in link lives 15 minutes and a session 12 hours by default; these exist to
      # make the dials visible, not because a deployment must set them.
      LOGIN_LINK_TTL_MINUTES: "${LOGIN_LINK_TTL_MINUTES:-}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-}"
      STORE_BUSY_TIMEOUT_MS: "${STORE_BUSY_TIMEOUT_MS:-}"

      DEMO_LOGIN: "1"
      DEMO_LOGIN_ORG: "example-ltd-demo"
      DEMO_LOGIN_TOKEN: "${DEMO_LOGIN_TOKEN:-local-demo-read-only-token-change-me}"
      DEMO_LOGIN_DAYS: "60"
    volumes:
      # --- the store: PERSISTENT, and outside the image ---
      #
      # A NAMED VOLUME, so `docker compose down` and `up` keeps the organisations. Without
      # it every restart would present an empty console, because a container writes to its
      # own layer and a new container starts from the image again.
      - forgeright-store:/data/store

      # --- the Proton session, for the mail transport ---
      #
      # A VOLUME, NOT A LAYER, because the session is a CREDENTIAL: it must not be in the
      # image, and it must survive a recreate. The binary is in the image; this is where it
      # keeps the sign-in. See the deploy file for the same volume on a server.
      #
      # XDG_CONFIG_HOME is set in the image, so the binary keeps its sessions here. See the
      # Dockerfile for why that variable rather than PROTON_CONFIG.
      - proton-session:/home/node/.config

      # --- the committed demo: READ-ONLY, and deliberately not the store ---
      #
      # `:ro` IS THE ARTEFACT-INTEGRITY REQUIREMENT. `data/demo` is a committed file with a
      # pinned organisation id; a container writing to it would dirty the working tree, and
      # this artefact has already been lost once.
      #
      # IT IS THE SOURCE, NOT THE STORE. The app cannot open a read-only database - every
      # connection applies the schema, which is a write - so the entrypoint copies this into
      # the writable volume on first start and the app opens the copy. See
      # docker-entrypoint.sh.
      - ./data/demo:/app/data/demo:ro
    healthcheck:
      # THE PATTERN IS TAKEN FROM WHAT THE APP ALREADY PRINTS, not a signal invented here. A
      # working startup logs `[server] listening on http://0.0.0.0:3000` followed by the
      # provider, the mount point, the trust-proxy setting and the accepted hosts. A failure
      # - a missing SESSION_SECRET, a bad PUBLIC_BASE_URL - throws BEFORE serving, so the
      # process exits and this reports unhealthy rather than looking up while nothing listens.
      #
      # `/healthz` rather than `/`: the root serves the landing page and would keep answering
      # 200 for a page whose assets are all 404. It is also the app's one path exempt from
      # the HTTPS rule, which is what lets the check run over plain HTTP inside the network.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # The TLS terminator. See Caddyfile for why this exists rather than plain HTTP:
  # the app refuses insecure connections by design, and that rule is load-bearing.
  # ---------------------------------------------------------------------------
  proxy:
    # Named rather than `<project>-proxy-1`, so `docker compose ps` and every log line
    # refers to the same thing whatever the checkout directory is called.
    container_name: forgeright-local-proxy
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports:
      # 8443 RATHER THAN 443, so the container needs no privileged port and the URL says
      # what it is: https://localhost:8443.
      #
      # A SECOND COPY NEEDS A DIFFERENT HOST PORT, for the same reason as the subnet above.
      # Override it with FORGERIGHT_PORT and the container's own PUBLIC_BASE_URL follows.
      - "${FORGERIGHT_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's internal CA and its certificates. A named volume so the CA survives a
      # restart, which means a browser warning is accepted once rather than every time.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      forgeright:
        # Waiting for healthy means the first request does not race the app's startup and
        # get a 502, which reads as a broken proxy rather than a starting application.
        condition: service_healthy
volumes:
  # Named, so it survives `down` and is only removed by `down -v`, which is the explicit way
  # to say "destroy the data".
  forgeright-store:
  caddy-data:
  caddy-config:
  # The Proton session. Named, so `docker compose down` keeps it and only `down -v`
  # removes it - signing in again is manual, and losing it to a routine restart would be
  # a nasty surprise.
  proton-session:
